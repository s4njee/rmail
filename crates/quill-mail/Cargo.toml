[package]
name = "quill-mail"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "IMAP / SMTP for Quill (no Tauri dependency)"

[dependencies]
quill-store = { path = "../quill-store" }
async-imap = "0.11"
async-native-tls = "0.5"
chrono = "0.4"
mail-parser = "0.9"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
rand = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
log = { workspace = true }
hickory-resolver = "0.26"
tiny_http = "0.12"
quick-xml = "0.41"
