[package]
name = "quill-mail"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "IMAP / SMTP for Quill (no Tauri dependency)"

[dependencies]
keyring = "4"
quill-store = { path = "../quill-store" }
async-imap = "0.11"
async-native-tls = "0.5"
chrono = "0.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
