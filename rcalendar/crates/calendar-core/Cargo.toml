[package]
name = "calendar-core"
description = "Pure-Rust calendar engine for rcalendar: date math, recurrence, iCal, storage traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/rcalendar/rcalendar"
homepage = "https://github.com/rcalendar/rcalendar"
readme = "README.md"
keywords = ["calendar", "recurrence", "rrule", "ical", "rfc5545"]
categories = ["date-and-time", "data-structures", "parser-implementations"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
ical = "0.11.0"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0.151"
