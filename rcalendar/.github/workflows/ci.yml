name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  seams:
    name: Seam Isolation (plan.md §8 & S7.3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Seam Isolation
        run: bash scripts/check-seams.sh

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (core + Tauri + examples)
        run: cargo test --workspace --examples

      - name: Run plain consumer example
        run: cargo run --example plain_consumer

  js:
    name: JS (install, lint, test, build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm test

      - name: Format check (Prettier)
        run: pnpm fmt:check

      - name: Build (packages + desktop)
        run: pnpm build
