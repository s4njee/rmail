# Quill — Cargo workspace.
#
# Members:
#   src-tauri            the Tauri app shell (package `quill`, the only crate
#                        that may depend on `tauri`)
#   crates/quill-store   SQLite persistence + domain types
#   crates/quill-mail    IMAP / SMTP
#   crates/quill-cal     CalDAV / iCalendar
#
# The three domain crates are deliberately free of any `tauri` dependency so
# the domain layer stays portable (CI enforces this — see
# scripts/check-domain-isolation.sh).

[workspace]
resolver = "2"
members = ["src-tauri", "crates/quill-store", "crates/quill-mail", "crates/quill-cal"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
