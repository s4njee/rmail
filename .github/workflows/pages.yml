name: Website

# Publishes site/ (home page, privacy policy, terms) to GitHub Pages. The
# privacy policy URL is what the Google and Microsoft consent screens link to.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.sh"
      - "docs/screenshots/01-mail-inbox.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
